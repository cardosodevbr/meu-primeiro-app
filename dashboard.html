<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Seu Painel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body id="corpo-pagina" style="display: none;">
    <div class="container">
        <h2 id="saudacao">Carregando...</h2>
        
        <div id="perfil-completo" style="display: none;">
            <img id="foto-exibicao" src="" width="150" style="border-radius: 50%;">
            <h3 id="nome-exibicao"></h3>
            <p id="cidade-exibicao"></p>
            <button onclick="sair()" style="background-color: #dc3545; margin-top: 15px;">Sair / Fazer Logout</button>
        </div>

        <div id="form-perfil">
            <h3>Complete seu cadastro</h3>
            <input type="text" id="nome" placeholder="Seu Nome">
            <select id="cidade">
                <option value="">Selecione sua cidade</option>
                <option value="Praia Grande">Praia Grande</option>
                <option value="São Paulo">São Paulo</option>
                <option value="Santos">Santos</option>
            </select>
            <input type="file" id="foto" accept="image/*">
            <button id="btn-salvar" onclick="salvarPerfil()">Salvar Perfil</button>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        let usuarioAtual = null;

        window.onload = async () => {
            // Usa o clienteSupabase
            const { data: { user } } = await clienteSupabase.auth.getUser();
            
            if (!user) {
                window.location.replace('auth.html');
                return; 
            }

            document.getElementById('corpo-pagina').style.display = 'flex';
            
            usuarioAtual = user;
            document.getElementById('saudacao').innerText = `Olá, ${user.email}`;
            
            carregarPerfil(user.id);
        };

        async function carregarPerfil(userId) {
            const { data, error } = await clienteSupabase.from('profiles').select('*').eq('id', userId).single();
            
            if (data && data.nome) {
                document.getElementById('form-perfil').style.display = 'none';
                document.getElementById('perfil-completo').style.display = 'block';
                
                document.getElementById('nome-exibicao').innerText = data.nome;
                document.getElementById('cidade-exibicao').innerText = data.cidade;
                document.getElementById('saudacao').innerText = `Olá, ${data.nome}!`;
                
                if (data.avatar_url) {
                    document.getElementById('foto-exibicao').src = data.avatar_url;
                }
            }
        }

        async function salvarPerfil() {
            const nome = document.getElementById('nome').value;
            const cidade = document.getElementById('cidade').value;
            const arquivoFoto = document.getElementById('foto').files[0];
            const btn = document.getElementById('btn-salvar');
            let urlFoto = null;

            if (!nome || !cidade) return alert("Preencha nome e cidade!");

            btn.innerText = 'Salvando e enviando foto...';

            if (arquivoFoto) {
                const caminho = `${usuarioAtual.id}/${arquivoFoto.name}`;
                const { data: imgData, error: imgError } = await clienteSupabase.storage.from('avatars').upload(caminho, arquivoFoto, { upsert: true });
                
                if (!imgError) {
                    const { data: { publicUrl } } = clienteSupabase.storage.from('avatars').getPublicUrl(caminho);
                    urlFoto = publicUrl;
                }
            }

            const { error } = await clienteSupabase.from('profiles').upsert({
                id: usuarioAtual.id,
                nome: nome,
                cidade: cidade,
                avatar_url: urlFoto
            });

            if (error) {
                alert("Erro ao salvar: " + error.message);
                btn.innerText = 'Salvar Perfil';
            } else {
                alert("Perfil atualizado com sucesso!");
                carregarPerfil(usuarioAtual.id);
            }
        }

        async function sair() {
            await clienteSupabase.auth.signOut();
            window.location.replace('auth.html');
        }
    </script>
</body>
</html>
