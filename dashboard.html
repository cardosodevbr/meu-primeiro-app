<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #f4f4f9; margin: 0;">
    
    <!-- ========================================== -->
    <!-- TELA DE CARREGAMENTO E ERRO SEGURA         -->
    <!-- ========================================== -->
    <div id="tela-carregamento" style="display: flex; height: 100vh; justify-content: center; align-items: center; flex-direction: column;">
        <h2 style="color: #0070f3;">Carregando seu painel...</h2>
        <p>Conectando ao banco de dados</p>
    </div>

    <div id="tela-erro" style="display: none; height: 100vh; justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px;">
        <h2 style="color: #dc3545;">Ops! Ocorreu um erro oculto.</h2>
        <p id="msg-erro" style="color: #555; background: #fff; padding: 15px; border-radius: 5px; border: 1px solid #ddd;"></p>
        <button class="btn-solid" onclick="window.location.reload()" style="margin-top: 20px;">Tentar Novamente</button>
        <button class="btn-cancelar" onclick="window.location.replace('auth.html')" style="width: auto; margin-top: 10px;">Voltar para o Login</button>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 1: TELA ISOLADA DE PERFIL (UX/UI)     -->
    <!-- ========================================== -->
    <div id="view-perfil" class="view-perfil" style="display: none;">
        <div class="perfil-card">
            <h2 id="titulo-perfil">Complete seu Cadastro</h2>
            <p id="subtitulo-perfil">Precisamos de mais alguns dados.</p>
            
            <input type="text" id="nome" placeholder="Seu Nome">
            
            <select id="cidade">
                <option value="">Selecione sua cidade</option>
                <option value="Praia Grande">Praia Grande</option>
                <option value="São Paulo">São Paulo</option>
                <option value="Santos">Santos</option>
            </select>
            
            <p style="font-size: 0.8rem; text-align: left; margin-bottom: 5px; color: #555;">Foto de Perfil:</p>
            <input type="file" id="foto" accept="image/*">
            
            <button class="btn-solid" id="btn-salvar" style="width: 100%;" onclick="salvarPerfil()">Salvar Perfil</button>
            <button class="btn-cancelar" id="btn-cancelar" onclick="fecharEdicao()">Cancelar</button>
            
            <!-- Linha divisória e o Botão de Excluir Conta (Movido para cá) -->
            <hr id="linha-excluir" style="border: 0; border-top: 1px solid #eee; margin: 25px 0 15px 0;">
            <button class="btn-danger" id="btn-excluir" style="width: 100%; padding: 12px; border-radius: 25px;" onclick="excluirConta()">Excluir Conta Definitivamente</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 2: DASHBOARD NOTION (PAINEL PRINCIPAL)-->
    <!-- ========================================== -->
    <div id="view-dashboard" class="dashboard-wrapper" style="display: none;">
        <div class="cover-image"></div>
        <div class="profile-section">
            <div class="avatar-container">
                <img id="foto-exibicao" src="https://via.placeholder.com/120" alt="Sua Foto">
            </div>
            <div class="profile-actions">
                <button class="btn-edit" onclick="abrirEdicao(false)">Editar Perfil</button>
                <!-- O botão "Excluir Conta" foi removido daqui para deixar o painel mais limpo -->
                <button class="btn-edit" onclick="sair()">Sair</button>
            </div>
        </div>

        <div class="dashboard-content">
            <h1 id="nome-exibicao">Carregando...</h1>
            <div class="quote-box">💡 "Esforce-se para não ser um sucesso, mas sim para ser valioso." - Albert Einstein</div>
            <h3 style="border-bottom: 1px solid #eee; padding-bottom: 10px;">Locais em <span id="cidade-exibicao">sua região</span></h3>
            <div class="grid-container" id="grid-shoppings"></div>
        </div>
    </div>

    <!-- Nossos Códigos e Conexões -->
    <script src="supabase-config.js"></script>
    <script>
        let usuarioAtual = null;

        const locaisPorCidade = {
            "Santos": ["Shopping Supercentro", "Shopping Parque Balneário", "Shopping Miramar"],
            "São Paulo": ["Shopping Tatuapé", "Shopping Villa Lobos", "Shopping Frei Caneca"],
            "Praia Grande": ["Shopping Boqueirão", "Litoral Plaza Shopping", "Shopping Vila Mirim"]
        };

        window.onload = async () => {
            try {
                if (typeof clienteSupabase === 'undefined') {
                    throw new Error("O arquivo supabase-config.js não carregou ou tem um erro de digitação.");
                }

                const { data: { user }, error: authError } = await clienteSupabase.auth.getUser();
                
                if (authError || !user) {
                    window.location.replace('auth.html');
                    return; 
                }

                usuarioAtual = user; 
                document.getElementById('tela-carregamento').style.display = 'none';
                await carregarPerfil(user.id);

            } catch (erro) {
                document.getElementById('tela-carregamento').style.display = 'none';
                document.getElementById('tela-erro').style.display = 'flex';
                document.getElementById('msg-erro').innerText = "Erro técnico: " + erro.message;
            }
        };

        async function carregarPerfil(userId) {
            const { data, error } = await clienteSupabase.from('profiles').select('*').eq('id', userId).single();
            
            if (data && data.nome) {
                document.getElementById('nome-exibicao').innerText = data.nome;
                document.getElementById('cidade-exibicao').innerText = data.cidade;
                if (data.avatar_url) document.getElementById('foto-exibicao').src = data.avatar_url;

                document.getElementById('nome').value = data.nome;
                document.getElementById('cidade').value = data.cidade;
                
                renderizarShoppings(data.cidade);
                fecharEdicao(); 
            } else {
                abrirEdicao(true);
            }
        }

        // --- ATUALIZAÇÃO IMPORTANTE AQUI ---
        function abrirEdicao(obrigatorio = false) {
            document.getElementById('view-dashboard').style.display = 'none';
            document.getElementById('view-perfil').style.display = 'flex';
            
            if (obrigatorio) {
                // Se for o 1º acesso, o usuário é obrigado a preencher.
                // Escondemos Cancelar e a opção de Excluir Conta.
                document.getElementById('titulo-perfil').innerText = "Complete seu Cadastro";
                document.getElementById('subtitulo-perfil').innerText = "Para continuar, precisamos de mais alguns dados.";
                
                document.getElementById('btn-cancelar').style.display = 'none';
                document.getElementById('btn-excluir').style.display = 'none';
                document.getElementById('linha-excluir').style.display = 'none';
            } else {
                // Se for apenas edição, mostramos todas as opções de controle de conta.
                document.getElementById('titulo-perfil').innerText = "Editar Perfil";
                document.getElementById('subtitulo-perfil').innerText = "Atualize ou gerencie suas informações.";
                
                document.getElementById('btn-cancelar').style.display = 'block';
                document.getElementById('btn-excluir').style.display = 'block';
                document.getElementById('linha-excluir').style.display = 'block';
            }
        }

        function fecharEdicao() {
            document.getElementById('view-perfil').style.display = 'none';
            document.getElementById('view-dashboard').style.display = 'block';
        }

        function renderizarShoppings(cidade) {
            const grid = document.getElementById('grid-shoppings');
            grid.innerHTML = ""; 
            const shoppings = locaisPorCidade[cidade];
            if (shoppings) {
                shoppings.forEach(shopping => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerText = shopping;
                    grid.appendChild(card); 
                });
            }
        }

        async function salvarPerfil() {
            const nome = document.getElementById('nome').value;
            const cidade = document.getElementById('cidade').value;
            const arquivoFoto = document.getElementById('foto').files[0];
            const btn = document.getElementById('btn-salvar');
            
            let urlFoto = document.getElementById('foto-exibicao').src; 

            if (!nome || !cidade) return alert("Preencha nome e cidade!");

            btn.innerText = 'Salvando...';

            if (arquivoFoto) {
                const caminho = `${usuarioAtual.id}/${arquivoFoto.name}`;
                const { error: imgError } = await clienteSupabase.storage.from('avatars').upload(caminho, arquivoFoto, { upsert: true });
                if (!imgError) {
                    const { data: { publicUrl } } = clienteSupabase.storage.from('avatars').getPublicUrl(caminho);
                    urlFoto = publicUrl;
                }
            }

            const { error } = await clienteSupabase.from('profiles').upsert({
                id: usuarioAtual.id,
                nome: nome,
                cidade: cidade,
                avatar_url: urlFoto !== "https://via.placeholder.com/120" ? urlFoto : null
            });

            btn.innerText = 'Salvar Perfil';

            if (error) alert("Erro: " + error.message);
            else carregarPerfil(usuarioAtual.id); 
        }

        async function excluirConta() {
            const confirmar = confirm("Tem certeza? Esta ação apagará sua conta e dados permanentemente.");
            if (!confirmar) return;
            try {
                await clienteSupabase.storage.from('avatars').remove([`${usuarioAtual.id}`]);
                await clienteSupabase.from('profiles').delete().eq('id', usuarioAtual.id);
                await clienteSupabase.rpc('excluir_minha_conta');
                await clienteSupabase.auth.signOut();
                window.location.replace('auth.html');
            } catch (erro) {
                alert("Erro ao excluir conta: " + erro.message);
            }
        }

        async function sair() {
            await clienteSupabase.auth.signOut();
            window.location.replace('auth.html');
        }
    </script>
</body>
</html>
