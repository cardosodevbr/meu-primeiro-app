<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso</title>
    <link rel="stylesheet" href="style.css">
    <!-- ⚠️ IMPORTANTE: A URL oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h2>Acesse sua conta</h2>
        <input type="email" id="email" placeholder="Seu E-mail" required>
        <input type="password" id="senha" placeholder="Sua Senha" required>
        <button onclick="fazerAcesso()">Continuar</button>
        <p id="mensagem" style="color: #666; margin-top: 10px;"></p>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        async function fazerAcesso() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const msg = document.getElementById('mensagem');
            
            if(!email || !senha) {
                msg.innerText = "Preencha e-mail e senha!";
                msg.style.color = "red";
                return;
            }

            msg.style.color = "#0070f3";
            msg.innerText = "Processando...";

            let { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });

            if (error) {
                if (error.message.includes('Invalid login credentials')) {
                    msg.innerText = "Conta não encontrada. Criando nova...";
                    const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password: senha });
                    
                    if (signUpError) {
                        msg.style.color = "red";
                        msg.innerText = "Erro ao criar: " + signUpError.message;
                        return;
                    }
                    msg.style.color = "green";
                    msg.innerText = "Conta criada! Entrando...";
                    window.location.replace('dashboard.html');
                } else {
                    msg.style.color = "red";
                    msg.innerText = "Erro: " + error.message;
                }
            } else {
                msg.style.color = "green";
                msg.innerText = "Login feito! Entrando...";
                window.location.replace('dashboard.html');
            }
        }
    </script>
</body>
</html>
