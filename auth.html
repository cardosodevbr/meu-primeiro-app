<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container auth-container">
        
        <!-- Lado Azul: Mensagem Institucional -->
        <div class="auth-panel auth-left">
            <h2 id="painel-titulo">Bem-vindo de volta!</h2>
            <p id="painel-texto">Para se manter conectado conosco, faça login com suas informações pessoais.</p>
            <button class="btn-outline" id="btn-trocar" onclick="alternarModo()">Entrar</button>
        </div>

        <!-- Lado Branco: Formulário Interativo -->
        <div class="auth-panel auth-right">
            <h2 id="form-titulo">Criar Conta</h2>
            <p id="form-subtitulo">use seu e-mail para registro:</p>
            
            <input type="email" id="email" placeholder="Seu E-mail" required>
            <input type="password" id="senha" placeholder="Sua Senha" required>
            
            <button class="btn-solid" id="btn-acao" onclick="executarAcao()">Cadastrar</button>
            <p id="mensagem" style="margin-top: 15px; font-size: 14px; font-weight: bold;"></p>
        </div>

    </div>

    <!-- Importação do Supabase configurado -->
    <script src="supabase-config.js"></script>
    
    <script>
        // A página nasce no modo "Criar Conta" para imitar o design de referência
        let modoLogin = false; 

        // Alterna visualmente entre Cadastro e Login
        function alternarModo() {
            modoLogin = !modoLogin;
            
            const msg = document.getElementById('mensagem');
            msg.innerText = ""; // Limpa erros antigos ao trocar de tela
            document.getElementById('senha').value = ""; // Limpa a senha por segurança

            if (modoLogin) {
                // Textos para estado de LOGIN
                document.getElementById('painel-titulo').innerText = "Novo por aqui?";
                document.getElementById('painel-texto').innerText = "Insira seus dados e comece sua jornada conosco.";
                document.getElementById('btn-trocar').innerText = "Criar Conta";
                
                document.getElementById('form-titulo').innerText = "Entrar";
                document.getElementById('form-subtitulo').innerText = "use seu e-mail e senha para acessar:";
                document.getElementById('btn-acao').innerText = "Entrar";
            } else {
                // Textos para estado de CADASTRO
                document.getElementById('painel-titulo').innerText = "Bem-vindo de volta!";
                document.getElementById('painel-texto').innerText = "Para se manter conectado conosco, faça login com suas informações pessoais.";
                document.getElementById('btn-trocar').innerText = "Entrar";
                
                document.getElementById('form-titulo').innerText = "Criar Conta";
                document.getElementById('form-subtitulo').innerText = "use seu e-mail para registro:";
                document.getElementById('btn-acao').innerText = "Cadastrar";
            }
        }

        // Executa a função correta no Supabase baseada no estado da tela
        async function executarAcao() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const msg = document.getElementById('mensagem');
            
            if(!email || !senha) {
                msg.style.color = "red";
                return msg.innerText = "Preencha e-mail e senha!";
            }

            msg.style.color = "#0070f3";
            msg.innerText = "Processando...";

            try {
                if (modoLogin) {
                    // Executa o LOGIN
                    const { data, error } = await clienteSupabase.auth.signInWithPassword({ email, password: senha });
                    if (error) throw error;
                    
                    msg.style.color = "green";
                    msg.innerText = "Acesso liberado! Redirecionando...";
                } else {
                    // Executa o CADASTRO
                    if(senha.length < 6) {
                        msg.style.color = "red";
                        return msg.innerText = "A senha deve ter pelo menos 6 caracteres!";
                    }
                    const { data, error } = await clienteSupabase.auth.signUp({ email, password: senha });
                    if (error) throw error;
                    
                    msg.style.color = "green";
                    msg.innerText = "Conta criada! Redirecionando...";
                }
                
                window.location.replace('dashboard.html');

            } catch (erro) {
                msg.style.color = "red";
                msg.innerText = "Erro: " + erro.message;
            }
        }
    </script>
</body>
</html>
