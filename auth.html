<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h2>Acesse sua conta</h2>
        <input type="email" id="email" placeholder="Seu E-mail" required>
        <input type="password" id="senha" placeholder="Sua Senha (mínimo 6 caracteres)" required>
        
        <button onclick="fazerLogin()">Entrar</button>
        <button onclick="fazerCadastro()" style="background-color: #28a745; margin-top: 10px;">Criar Nova Conta</button>
        
        <p id="mensagem" style="color: #666; margin-top: 10px;"></p>
    </div>

    <script src="supabase-config.js"></script>
    
    <script>
        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const msg = document.getElementById('mensagem');
            
            if(!email || !senha) return msg.innerText = "Preencha e-mail e senha!";

            msg.style.color = "#0070f3";
            msg.innerText = "Processando login...";

            try {
                // Usa o clienteSupabase
                const { data, error } = await clienteSupabase.auth.signInWithPassword({ email, password: senha });

                if (error) {
                    msg.style.color = "red";
                    msg.innerText = "Erro ao entrar: " + error.message;
                } else {
                    msg.style.color = "green";
                    msg.innerText = "Login realizado! Entrando...";
                    window.location.replace('dashboard.html');
                }
            } catch (erroFatal) {
                msg.style.color = "red";
                msg.innerText = "Erro de sistema: " + erroFatal.message;
            }
        }

        async function fazerCadastro() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const msg = document.getElementById('mensagem');
            
            if(!email || !senha) return msg.innerText = "Preencha e-mail e senha!";
            if(senha.length < 6) return msg.innerText = "A senha deve ter pelo menos 6 caracteres!";

            msg.style.color = "#28a745";
            msg.innerText = "Processando cadastro...";

            try {
                // Usa o clienteSupabase
                const { data, error } = await clienteSupabase.auth.signUp({ email, password: senha });

                if (error) {
                    msg.style.color = "red";
                    msg.innerText = "Erro ao criar: " + error.message;
                } else {
                    msg.style.color = "green";
                    msg.innerText = "Conta criada com sucesso! Entrando...";
                    window.location.replace('dashboard.html');
                }
            } catch (erroFatal) {
                msg.style.color = "red";
                msg.innerText = "Erro de sistema: " + erroFatal.message;
            }
        }
    </script>
</body>
</html>
